async function copyAsImage(btn){const o=btn.textContent;try{const el=document.getElementById('report-container');const r=el.getBoundingClientRect();const p=32;const c=await html2canvas(document.body,{backgroundColor:'#020617',scale:2,useCORS:true,ignoreElements:e=>e.classList&&e.classList.contains('toolbar'),x:r.left+window.scrollX-p,y:r.top+window.scrollY-p,width:r.width+p*2,height:r.height+p*2});const b=await new Promise(r=>c.toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);btn.textContent='✓ Copied!';}catch(e){btn.textContent='✗ Failed';}setTimeout(()=>btn.textContent=o,2000);}
async function downloadPNG(btn){const o=btn.textContent;btn.textContent='⏳';try{const el=document.getElementById('report-container');const r=el.getBoundingClientRect();const p=32;const c=await html2canvas(document.body,{backgroundColor:'#020617',scale:2,useCORS:true,ignoreElements:e=>e.classList&&e.classList.contains('toolbar'),x:r.left+window.scrollX-p,y:r.top+window.scrollY-p,width:r.width+p*2,height:r.height+p*2});const a=document.createElement('a');a.download='diagram.png';a.href=c.toDataURL('image/png');a.click();btn.textContent='✓';}catch(e){btn.textContent='✗';}setTimeout(()=>btn.textContent=o,2000);}
async function downloadPDF(btn){const o=btn.textContent;btn.textContent='⏳';try{const el=document.getElementById('report-container');const r=el.getBoundingClientRect();const p=32;const c=await html2canvas(document.body,{backgroundColor:'#020617',scale:2,useCORS:true,ignoreElements:e=>e.classList&&e.classList.contains('toolbar'),x:r.left+window.scrollX-p,y:r.top+window.scrollY-p,width:r.width+p*2,height:r.height+p*2});const i=c.toDataURL('image/png');const{jsPDF}=window.jspdf;const or=c.width>c.height?'landscape':'portrait';const pdf=new jsPDF({orientation:or,unit:'px',format:[c.width,c.height],hotfixes:['px_scaling']});pdf.addImage(i,'PNG',0,0,c.width,c.height);pdf.save('report.pdf');btn.textContent='✓';}catch(e){btn.textContent='✗';}setTimeout(()=>btn.textContent=o,2000);}
</script></body></html>
