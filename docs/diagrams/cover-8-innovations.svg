<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4d6bfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="350" x2="900" y2="350"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="450" x2="900" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
  </g>

  <!-- Decorative graph nodes -->
  <g opacity="0.15">
    <circle cx="120" cy="100" r="6" fill="#4d6bfe"/>
    <circle cx="280" cy="160" r="4" fill="#7c3aed"/>
    <circle cx="450" cy="80" r="5" fill="#4d6bfe"/>
    <circle cx="620" cy="140" r="6" fill="#7c3aed"/>
    <circle cx="780" cy="90" r="4" fill="#4d6bfe"/>
    <circle cx="180" cy="380" r="5" fill="#7c3aed"/>
    <circle cx="350" cy="420" r="6" fill="#4d6bfe"/>
    <circle cx="520" cy="390" r="4" fill="#7c3aed"/>
    <circle cx="700" cy="410" r="5" fill="#4d6bfe"/>
    <circle cx="820" cy="370" r="6" fill="#7c3aed"/>
    <line x1="120" y1="100" x2="280" y2="160" stroke="#4d6bfe" stroke-width="1"/>
    <line x1="280" y1="160" x2="450" y2="80" stroke="#7c3aed" stroke-width="1"/>
    <line x1="450" y1="80" x2="620" y2="140" stroke="#4d6bfe" stroke-width="1"/>
    <line x1="620" y1="140" x2="780" y2="90" stroke="#7c3aed" stroke-width="1"/>
    <line x1="180" y1="380" x2="350" y2="420" stroke="#4d6bfe" stroke-width="1"/>
    <line x1="350" y1="420" x2="520" y2="390" stroke="#7c3aed" stroke-width="1"/>
    <line x1="520" y1="390" x2="700" y2="410" stroke="#4d6bfe" stroke-width="1"/>
    <line x1="700" y1="410" x2="820" y2="370" stroke="#7c3aed" stroke-width="1"/>
  </g>

  <!-- Center content -->
  <g text-anchor="middle">
    <!-- Tag -->
    <rect x="310" y="130" width="280" height="32" rx="16" fill="url(#accent)" opacity="0.15"/>
    <text x="450" y="151" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#4d6bfe" letter-spacing="2">AGENT ENGINEERING</text>

    <!-- Main title -->
    <text x="450" y="220" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#f8fafc" letter-spacing="-1">8 个让 Agent 工程</text>
    <text x="450" y="275" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#f8fafc" letter-spacing="-1">不再失控的创新</text>

    <!-- Subtitle -->
    <text x="450" y="320" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#94a3b8">用 ArchiMate 3.2 企业架构标准，构建 Agent 的施工图</text>

    <!-- Divider -->
    <line x1="380" y1="350" x2="520" y2="350" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>

    <!-- Bottom tags -->
    <g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748b">
      <text x="250" y="385">知识图谱驱动</text>
      <text x="400" y="385">·</text>
      <text x="450" y="385">验收用例先行</text>
      <text x="600" y="385">·</text>
      <text x="650" y="385">变更可追溯</text>
    </g>

    <!-- Brand -->
    <text x="450" y="440" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#4d6bfe" letter-spacing="3">ArchGraph</text>
    <text x="450" y="462" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569">archgraph.org</text>
  </g>
</svg>