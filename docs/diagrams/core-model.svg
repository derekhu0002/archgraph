<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-label="ArchGraph core model: one model containing harness design and target system design" style="font-family: inherit;">
  <defs>
    <marker id="cm-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d6bfe"/>
    </marker>
  </defs>

  <!-- ONE MODEL boundary -->
  <rect x="30" y="28" width="860" height="150" rx="14" fill="rgba(77,107,254,0.04)" stroke="#4d6bfe" stroke-width="1.5"/>
  <text x="50" y="56" font-size="14" font-weight="700" fill="#0f172a">ONE MODEL</text>
  <text x="50" y="72" font-size="11" fill="#5b6472">a unified language</text>

  <!-- Harness Design -->
  <rect x="80" y="100" width="280" height="56" rx="10" fill="rgba(77,107,254,0.08)" stroke="#4d6bfe" stroke-opacity="0.35"/>
  <text x="220" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">Harness Design</text>
  <text x="220" y="142" text-anchor="middle" font-size="10.5" fill="#4d6bfe">how the harness arms itself &amp; evolves</text>

  <!-- Target System Design -->
  <rect x="560" y="100" width="300" height="56" rx="10" fill="rgba(77,107,254,0.08)" stroke="#4d6bfe" stroke-opacity="0.35"/>
  <text x="710" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">Target System Design</text>
  <text x="710" y="142" text-anchor="middle" font-size="10.5" fill="#4d6bfe">the architecture of the target system</text>

  <!-- describes: Harness Design -> Target System Design -->
  <line x1="360" y1="128" x2="560" y2="128" stroke="#4d6bfe" stroke-width="1.5" marker-end="url(#cm-arrow)"/>
  <text x="460" y="118" text-anchor="middle" font-size="11" fill="#5b6472">describes</text>

  <!-- AgentHarness -->
  <rect x="80" y="270" width="280" height="56" rx="10" fill="#f5f7fa" stroke="#e6e8ee"/>
  <text x="220" y="294" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">AgentHarness</text>
  <text x="220" y="312" text-anchor="middle" font-size="10.5" fill="#5b6472">a thin harness &mdash; Claude Code, Cursor, opencode</text>

  <!-- Target Project -->
  <rect x="560" y="270" width="300" height="56" rx="10" fill="rgba(77,107,254,0.06)" stroke="#4d6bfe" stroke-opacity="0.35"/>
  <text x="710" y="294" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">Target Project</text>
  <text x="710" y="312" text-anchor="middle" font-size="10.5" fill="#4d6bfe">the system built by the armed harness</text>

  <!-- arms itself: AgentHarness -> Harness Design -->
  <line x1="220" y1="270" x2="220" y2="156" stroke="#4d6bfe" stroke-width="1.5" marker-end="url(#cm-arrow)"/>
  <text x="232" y="216" font-size="11" fill="#5b6472">arms itself</text>

  <!-- describes: Target System Design -> Target Project -->
  <line x1="710" y1="156" x2="710" y2="270" stroke="#4d6bfe" stroke-width="1.5" marker-end="url(#cm-arrow)"/>
  <text x="722" y="216" font-size="11" fill="#5b6472">describes</text>

  <!-- creates: AgentHarness -> Target Project -->
  <line x1="360" y1="298" x2="560" y2="298" stroke="#4d6bfe" stroke-width="1.5" marker-end="url(#cm-arrow)"/>
  <text x="460" y="316" text-anchor="middle" font-size="11" fill="#5b6472">creates</text>
</svg>
