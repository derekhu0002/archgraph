<text x="24" y="340" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI', Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0">T1 is the only tier loaded into the context at session start</text>
