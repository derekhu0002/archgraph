<rect x="0" y="0" width="560" height="360" fill="#0a0e1a"/>
<rect x="0" y="0" width="560" height="360" fill="url(#grid)"/>
<text x="24" y="36" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI', Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#eef1f6" text-anchor="start" opacity="1" letter-spacing="0">Three-tier memory</text>
<rect x="150" y="74" width="280" height="56" rx="10" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-width="1.5"/><text x="290" y="98.9" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI', Consolas, 'Courier New', monospace" font-size="14" font-weight="600" fill="#eef1f6" text-anchor="middle" opacity="1" letter-spacing="0">T1 · working memory</text><text x="290" y="114.9" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI', Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="1" letter-spacing="0">session digest · loaded at start</text>
